name: QA final Saggio 16 cover

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/saggio-16-cover-final

      - name: Validate asset and references
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat
          import struct, hashlib
          p=Path('assets/img/saggi/site/saggio-16-la-pace-senza-forma_site_960x540.webp')
          b=p.read_bytes(); declared=struct.unpack_from('<I',b,4)[0]+8
          assert b[:4]==b'RIFF' and b[8:12]==b'WEBP' and declared==len(b)
          im=Image.open(p).convert('RGB'); stat=ImageStat.Stat(im)
          assert im.size==(960,540) and any(hi-lo>40 for lo,hi in stat.extrema)
          print(len(b), hashlib.sha256(b).hexdigest(), im.size, stat.extrema)
          PY
          test "$(find assets/img/saggi/site -maxdepth 1 -type f -name 'saggio-16-la-pace-senza-forma*.webp' | wc -l)" -eq 1
          ! grep -R --line-number --exclude-dir=.git --exclude-dir=.github 'saggio-16-la-pace-senza-forma-960x540.webp' assets index.html saggi.html saggi tools
          node tools/check-saggio-16-publication.mjs

      - name: Install browser
        run: |
          mkdir -p evidence
          npm init -y >/dev/null
          npm install playwright@1.54.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Render desktop and mobile
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >evidence/server.log 2>&1 &
          sleep 2
          cat > evidence/qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          const browser=await chromium.launch({headless:true});
          const targets=[['home','/'],['saggi','/saggi.html'],['essay','/saggi/saggio-16-la-pace-senza-forma.html']];
          const modes=[['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]];
          const report=[]; let failed=false;
          for(const [mode,viewport] of modes){for(const [name,path] of targets){
            const c=await browser.newContext({viewport}); const p=await c.newPage(); const errors=[];
            p.on('console',m=>{if(m.type()==='error')errors.push(m.text())}); p.on('pageerror',e=>errors.push(e.message)); p.on('requestfailed',r=>errors.push(`${r.url()} :: ${r.failure()?.errorText}`));
            const r=await p.goto('http://127.0.0.1:8000'+path,{waitUntil:'networkidle'});
            const loc=p.locator('img[src*="saggio-16-la-pace-senza-forma"]');
            for(let i=0;i<await loc.count();i++)await loc.nth(i).scrollIntoViewIfNeeded();
            await p.waitForFunction(()=>[...document.images].filter(i=>i.src.includes('saggio-16-la-pace-senza-forma')).every(i=>i.complete&&i.naturalWidth>0));
            const data=await p.evaluate(()=>({cards:document.querySelectorAll('[data-saggio-16]').length,images:[...document.images].filter(i=>i.src.includes('saggio-16-la-pace-senza-forma')).map(i=>{const s=getComputedStyle(i),r=i.getBoundingClientRect(),c=document.createElement('canvas');c.width=32;c.height=18;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(i,0,0,32,18);const d=x.getImageData(0,0,32,18).data;let lo=255,hi=0;for(let j=0;j<d.length;j+=4){const v=(d[j]+d[j+1]+d[j+2])/3;lo=Math.min(lo,v);hi=Math.max(hi,v)}return{w:i.naturalWidth,h:i.naturalHeight,rw:r.width,rh:r.height,display:s.display,visibility:s.visibility,opacity:s.opacity,range:hi-lo}})}));
            await p.screenshot({path:`evidence/${mode}-${name}.png`,fullPage:true});
            const expected=name==='essay'?0:1; const ok=r.status()===200&&data.cards===expected&&data.images.length===1&&data.images.every(i=>i.w===960&&i.h===540&&i.rw>0&&i.rh>0&&i.display!=='none'&&i.visibility!=='hidden'&&Number(i.opacity)>0&&i.range>40)&&errors.length===0;
            if(!ok)failed=true; report.push({mode,name,status:r.status(),...data,errors,ok}); await c.close();
          }}
          const c=await browser.newContext();const p=await c.newPage();const errors=[];p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});p.on('requestfailed',r=>errors.push(`${r.url()} :: ${r.failure()?.errorText}`));await p.goto('http://127.0.0.1:8000/archivio.html',{waitUntil:'networkidle'});const order=await p.evaluate(()=>[...document.querySelectorAll('[data-archive-item][data-category="saggi"] h3')].map(h=>Number(h.textContent.match(/^(\d+)/)?.[1])).filter(Number.isFinite));const expected=[16,15,14,13,12],ok=expected.every((v,i)=>order[i]===v)&&errors.length===0;if(!ok)failed=true;report.push({name:'archive-order',order:order.slice(0,8),errors,ok});await c.close();
          await browser.close();await fs.writeFile('evidence/report.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));if(failed)process.exit(1);
          JS
          node evidence/qa.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saggio-16-final-qa
          path: evidence/
          retention-days: 7
