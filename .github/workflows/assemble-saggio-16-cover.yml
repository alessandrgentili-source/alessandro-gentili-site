name: Assemble Saggio 16 cover asset

on:
  push:
    branches:
      - saggio-16-cover-assets
    paths:
      - .staging/saggio-16-cover/READY

permissions:
  contents: write

jobs:
  assemble-cover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify and assemble approved cover
        shell: bash
        run: |
          set -euo pipefail
          stage_dir=".staging/saggio-16-cover"
          test -f "$stage_dir/SHA256"
          test -f "$stage_dir/part-000.txt"
          cat "$stage_dir"/part-*.txt > /tmp/saggio-16-cover.b64
          base64 --decode /tmp/saggio-16-cover.b64 > /tmp/saggio-16-cover.webp
          expected_sha="$(tr -d '[:space:]' < "$stage_dir/SHA256")"
          echo "$expected_sha  /tmp/saggio-16-cover.webp" | sha256sum --check

          python - <<'PY'
          from pathlib import Path
          source = Path('/tmp/saggio-16-cover.webp')
          data = source.read_bytes()
          if len(data) != 17568:
              raise SystemExit(f'Unexpected cover size: {len(data)} bytes')
          if data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit('Decoded asset is not a WebP file')
          target = Path('assets/img/saggi/site/saggio-16-la-pace-senza-forma_site_960x540.webp')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(data)
          PY

          rm -rf "$stage_dir"
          rm -f .github/workflows/assemble-saggio-16-cover.yml

      - name: Commit approved cover asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add Saggio 16 cover asset"
          git push origin HEAD:${{ github.ref_name }}
