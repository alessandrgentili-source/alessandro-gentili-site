name: Inspect Saggio 16 cover candidate

on:
  push:
    branches: [fix/saggio-16-cover-final]

permissions:
  contents: read

jobs:
  inspect-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/saggio-16-cover-final
          fetch-depth: 0

      - name: Recover candidate from preserved asset branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git fetch origin saggio-16-cover-assets
          git show origin/saggio-16-cover-assets:assets/img/saggi/site/saggio-16-la-pace-senza-forma_site_960x540.webp > evidence/candidate.webp
          cp assets/img/saggi/site/saggio-16-la-pace-senza-forma_site_960x540.webp evidence/current-corrupt.webp
          file evidence/*.webp | tee evidence/report.txt
          wc -c evidence/*.webp | tee -a evidence/report.txt
          sha256sum evidence/*.webp | tee -a evidence/report.txt
          python3 - <<'PY' | tee -a evidence/report.txt
          from pathlib import Path
          import struct
          for name in ('candidate.webp', 'current-corrupt.webp'):
              b = (Path('evidence') / name).read_bytes()
              declared = struct.unpack_from('<I', b, 4)[0] + 8 if len(b) >= 8 and b[:4] == b'RIFF' else None
              print(f'{name}: actual={len(b)} declared={declared} riff={b[:4]!r} webp={b[8:12]!r}')
              if name == 'candidate.webp':
                  assert b[:4] == b'RIFF' and b[8:12] == b'WEBP'
                  assert declared == len(b), (declared, len(b))
          PY
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,pix_fmt -of default=noprint_wrappers=1 evidence/candidate.webp | tee -a evidence/report.txt
          ffmpeg -v error -y -i evidence/candidate.webp -frames:v 1 evidence/candidate.png
          test -s evidence/candidate.png

      - name: Upload candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: saggio-16-cover-candidate
          path: evidence/
          retention-days: 7
