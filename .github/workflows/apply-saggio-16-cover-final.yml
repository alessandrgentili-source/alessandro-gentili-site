name: Apply final Saggio 16 cover canonicalization

on:
  push:
    branches: [fix/saggio-16-cover-final]

permissions:
  contents: write

jobs:
  apply-final-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/saggio-16-cover-final
          fetch-depth: 0

      - name: Canonicalize asset and references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old_name = 'saggio-16-la-pace-senza-forma-960x540.webp'
          canonical_name = 'saggio-16-la-pace-senza-forma_site_960x540.webp'
          asset_root = f'/assets/img/saggi/site/{canonical_name}'

          files = [
              Path('index.html'),
              Path('saggi.html'),
              Path('saggi/saggio-16-la-pace-senza-forma.html'),
              Path('assets/script.js'),
              Path('tools/check-saggio-16-publication.mjs'),
          ]

          for path in files:
              text = path.read_text(encoding='utf-8')
              text = text.replace(old_name, canonical_name)
              path.write_text(text, encoding='utf-8')

          for path in (Path('index.html'), Path('saggi.html')):
              text = path.read_text(encoding='utf-8')
              text = text.replace(
                  f'src="assets/img/saggi/site/{canonical_name}"',
                  f'src="{asset_root}"',
              )
              path.write_text(text, encoding='utf-8')

          essay = Path('saggi/saggio-16-la-pace-senza-forma.html')
          text = essay.read_text(encoding='utf-8')
          text = text.replace(
              f'src="../assets/img/saggi/site/{canonical_name}"',
              f'src="{asset_root}"',
          )
          essay.write_text(text, encoding='utf-8')

          checker = Path('tools/check-saggio-16-publication.mjs')
          text = checker.read_text(encoding='utf-8')
          text = text.replace(
              'assert(home.includes(`src="${coverPath}"`),',
              'assert(home.includes(`src="${coverUrl}"`),',
          )
          text = text.replace(
              'assert(saggi.includes(`src="${coverPath}"`),',
              'assert(saggi.includes(`src="${coverUrl}"`),',
          )
          text = text.replace(
              'assert(essay.includes(`src="../${coverPath}"`),',
              'assert(essay.includes(`src="${coverUrl}"`),',
          )
          checker.write_text(text, encoding='utf-8')
          PY

          rm -f assets/img/saggi/site/saggio-16-la-pace-senza-forma-960x540.webp
          rm -f .github/workflows/diagnose-saggio-16-public.yml
          rm -f .github/workflows/apply-saggio-16-cover-final.yml

          if rg -n 'saggio-16-la-pace-senza-forma-960x540\.webp' --glob '!*.git*' .; then
            echo 'Found obsolete versioned filename' >&2
            exit 1
          fi
          test "$(find assets/img/saggi/site -maxdepth 1 -type f -name 'saggio-16-la-pace-senza-forma*.webp' | wc -l)" -eq 1
          file assets/img/saggi/site/saggio-16-la-pace-senza-forma_site_960x540.webp
          node tools/check-saggio-16-publication.mjs
          git diff --check

      - name: Commit final minimal patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Canonicalize Saggio 16 cover asset'
          git push origin HEAD:fix/saggio-16-cover-final
