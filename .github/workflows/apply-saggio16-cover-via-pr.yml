name: Apply intact Saggio 16 cover via PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-cover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/saggio-16-cover-final
          fetch-depth: 0

      - name: Replace truncated binary and strengthen validation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin saggio-16-cover-assets
          git show origin/saggio-16-cover-assets:assets/img/saggi/site/saggio-16-la-pace-senza-forma_site_960x540.webp > assets/img/saggi/site/saggio-16-la-pace-senza-forma_site_960x540.webp

          python3 - <<'PY'
          from pathlib import Path
          checker = Path('tools/check-saggio-16-publication.mjs')
          text = checker.read_text(encoding='utf-8')
          needle = "  assert(buffer.subarray(8, 12).toString('ascii') === 'WEBP', 'Cover is not a WEBP file');\n"
          addition = "  const declaredLength = buffer.readUInt32LE(4) + 8;\n  assert(declaredLength === buffer.length, `Truncated WebP: RIFF declares ${declaredLength} bytes, file contains ${buffer.length}`);\n"
          if addition not in text:
              assert needle in text
              text = text.replace(needle, needle + addition)
              checker.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/inspect-saggio16-cover-candidate.yml
          rm -f .github/workflows/apply-and-test-saggio16-cover.yml
          rm -f .github/workflows/apply-saggio16-cover-via-pr.yml

          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat
          import hashlib, struct
          path = Path('assets/img/saggi/site/saggio-16-la-pace-senza-forma_site_960x540.webp')
          data = path.read_bytes()
          declared = struct.unpack_from('<I', data, 4)[0] + 8
          assert data[:4] == b'RIFF' and data[8:12] == b'WEBP'
          assert declared == len(data), (declared, len(data))
          image = Image.open(path).convert('RGB')
          stat = ImageStat.Stat(image)
          assert image.size == (960, 540)
          assert any(high - low > 40 for low, high in stat.extrema)
          print(f'bytes={len(data)}')
          print(f'sha256={hashlib.sha256(data).hexdigest()}')
          print(f'size={image.size}')
          print(f'extrema={stat.extrema}')
          PY

          if rg -n 'saggio-16-la-pace-senza-forma-960x540\.webp' --glob '!*.git*' .; then
            echo 'Obsolete duplicate filename still present' >&2
            exit 1
          fi
          test "$(find assets/img/saggi/site -maxdepth 1 -type f -name 'saggio-16-la-pace-senza-forma*.webp' | wc -l)" -eq 1
          node tools/check-saggio-16-publication.mjs
          git diff --check

      - name: Commit binary replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace truncated Saggio 16 cover binary'
          git push origin HEAD:fix/saggio-16-cover-final
