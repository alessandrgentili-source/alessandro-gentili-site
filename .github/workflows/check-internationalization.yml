name: Check internationalization

on:
  pull_request:
    paths:
      - 'en/**'
      - 'index.html'
      - 'cerchi/guide/**'
      - 'cerchi/index.html'
      - 'cerchi/triadi/index.html'
      - 'temi/index.html'
      - 'en.html'
      - 'metodo-ai.html'
      - 'strumenti.html'
      - 'assets/script.js'
      - 'assets/style.css'
      - 'assets/international-atlas.*'
      - 'assets/international-pasolini.css'
      - 'assets/international-plato.css'
      - 'assets/international-mattei.css'
      - 'assets/international-merloni.css'
      - 'assets/international-olivetti.css'
      - 'tools/check-olivetti-en36.py'
      - 'tools/check-merloni-en35.py'
      - 'tools/check-mattei-en34.py'
      - 'tools/international_revision.py'
      - 'tools/validate-cerchi-guide.py'
      - 'tools/check-cerchi-atlas-pilot.py'
      - '.agents/skills/cerchi-publisher/**'
      - 'docs/international-3/SYSTEM.md'
      - 'tools/check-international-guide.py'
      - 'tools/check-international-atlas.mjs'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'llms.txt'
      - 'archivio.html'
      - 'tools/check-i18n-consistency.mjs'
      - '.github/workflows/check-internationalization.yml'
  push:
    branches:
      - main
    paths:
      - 'en/**'
      - 'index.html'
      - 'cerchi/guide/**'
      - 'cerchi/index.html'
      - 'cerchi/triadi/index.html'
      - 'temi/index.html'
      - 'en.html'
      - 'metodo-ai.html'
      - 'strumenti.html'
      - 'assets/script.js'
      - 'assets/style.css'
      - 'assets/international-atlas.*'
      - 'assets/international-pasolini.css'
      - 'assets/international-plato.css'
      - 'assets/international-mattei.css'
      - 'assets/international-merloni.css'
      - 'assets/international-olivetti.css'
      - 'tools/check-olivetti-en36.py'
      - 'tools/check-merloni-en35.py'
      - 'tools/check-mattei-en34.py'
      - 'tools/international_revision.py'
      - 'tools/validate-cerchi-guide.py'
      - 'tools/check-cerchi-atlas-pilot.py'
      - '.agents/skills/cerchi-publisher/**'
      - 'docs/international-3/SYSTEM.md'
      - 'tools/check-international-guide.py'
      - 'tools/check-international-atlas.mjs'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'llms.txt'
      - 'archivio.html'
      - 'tools/check-i18n-consistency.mjs'
      - '.github/workflows/check-internationalization.yml'

permissions:
  contents: read

jobs:
  internationalization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bilingual architecture and complete English corpus
        run: node tools/check-i18n-consistency.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify shared International behaviour
        run: |
          node --check assets/international-atlas.js
          node tools/check-international-atlas.mjs
      - name: Verify pinned Plato EN revision and regression mutations
        run: |
          git fetch --no-tags origin f36e2f29a7ea9ec6e691244c851ad3b877ed236a
          python3 tools/international_revision.py --base c3c6936268a02b3b43474cb4aba7bfb42890530e --self-test
          git show f36e2f29a7ea9ec6e691244c851ad3b877ed236a:PLATO_EN_GUIDE_01_CANDIDATE_v2.md > "$RUNNER_TEMP/plato-v2.md"
          python3 tools/validate-cerchi-guide.py en/cerchi/guides/plato-ideas-truth-power/index.html --cover assets/img/cerchi/cerchi-platone-idee-verita-potere-1600x900.jpg --source "$RUNNER_TEMP/plato-v2.md" --mode EN_REVISION --base c3c6936268a02b3b43474cb4aba7bfb42890530e
      - name: Validate new IT/EN Atlas drafts and immutable Mattei pilot
        run: python3 tools/check-cerchi-atlas-pilot.py --self-test
      - name: Verify approved Mattei EN34 source, figures and rejection regressions
        run: |
          git fetch --no-tags origin 456fd03610c36a69b211dd8d8b31ac2502729cbd
          git show 456fd03610c36a69b211dd8d8b31ac2502729cbd:MATTEI_EN34_TESTO_FINALE_APPROVATO_2026-11-16.md > "$RUNNER_TEMP/mattei-en34.md"
          python3 tools/check-mattei-en34.py --source "$RUNNER_TEMP/mattei-en34.md" --self-test
      - name: Verify frozen Merloni EN35, five comparisons and strict FAQ regressions
        run: |
          git fetch --no-tags origin e47e86e1dc6d06d6338e3dacd908a2195b0a5548
          git show e47e86e1dc6d06d6338e3dacd908a2195b0a5548:MERLONI_EN35_TESTO_FINALE_APPROVATO_2026-11-16.md > "$RUNNER_TEMP/merloni-en35.md"
          python3 tools/check-merloni-en35.py --source "$RUNNER_TEMP/merloni-en35.md" --self-test
      - name: Verify approved Olivetti EN36, institutional distinctions and both source layouts
        run: |
          git fetch --no-tags origin 4a1bb79448b4c28414ec4b9d2f87c1e07a4501c6
          git show 4a1bb79448b4c28414ec4b9d2f87c1e07a4501c6:OLIVETTI_EN36_TESTO_FINALE_APPROVATO_v2_2026-11-16.md > "$RUNNER_TEMP/olivetti-en36.md"
          python3 tools/check-olivetti-en36.py --source "$RUNNER_TEMP/olivetti-en36.md" --self-test
      - name: Preserve existing English guides during migration
        if: github.event_name == 'pull_request'
        env:
          ATLAS_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/check-international-guide.py --base "$ATLAS_BASE"
