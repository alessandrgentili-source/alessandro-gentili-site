name: Check internationalization

on:
  pull_request:
    paths:
      - 'en/**'
      - 'index.html'
      - 'cerchi/guide/**'
      - 'cerchi/index.html'
      - 'cerchi/triadi/index.html'
      - 'temi/index.html'
      - 'en.html'
      - 'metodo-ai.html'
      - 'strumenti.html'
      - 'assets/script.js'
      - 'assets/style.css'
      - 'assets/international-atlas.*'
      - 'assets/international-pasolini.css'
      - 'tools/check-international-guide.py'
      - 'tools/check-international-atlas.mjs'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'llms.txt'
      - 'archivio.html'
      - 'tools/check-i18n-consistency.mjs'
      - '.github/workflows/check-internationalization.yml'
  push:
    branches:
      - main
    paths:
      - 'en/**'
      - 'index.html'
      - 'cerchi/guide/**'
      - 'cerchi/index.html'
      - 'cerchi/triadi/index.html'
      - 'temi/index.html'
      - 'en.html'
      - 'metodo-ai.html'
      - 'strumenti.html'
      - 'assets/script.js'
      - 'assets/style.css'
      - 'assets/international-atlas.*'
      - 'assets/international-pasolini.css'
      - 'tools/check-international-guide.py'
      - 'tools/check-international-atlas.mjs'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'llms.txt'
      - 'archivio.html'
      - 'tools/check-i18n-consistency.mjs'
      - '.github/workflows/check-internationalization.yml'

permissions:
  contents: read

jobs:
  internationalization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bilingual architecture and complete English corpus
        run: node tools/check-i18n-consistency.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify shared International behaviour
        run: |
          node --check assets/international-atlas.js
          node tools/check-international-atlas.mjs
      - name: Preserve existing English guides during migration
        if: github.event_name == 'pull_request'
        env:
          ATLAS_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/check-international-guide.py --base "$ATLAS_BASE"
