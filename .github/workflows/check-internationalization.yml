name: Check internationalization

on:
  pull_request:
    paths:
      - 'en/**'
      - 'index.html'
      - 'cerchi/guide/**'
      - 'cerchi/index.html'
      - 'cerchi/triadi/index.html'
      - 'temi/index.html'
      - 'en.html'
      - 'metodo-ai.html'
      - 'strumenti.html'
      - 'assets/script.js'
      - 'assets/style.css'
      - 'assets/international-atlas.*'
      - 'assets/international-pasolini.css'
      - 'assets/international-plato.css'
      - 'tools/international_revision.py'
      - 'tools/validate-cerchi-guide.py'
      - 'tools/check-international-guide.py'
      - 'tools/check-international-atlas.mjs'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'llms.txt'
      - 'archivio.html'
      - 'tools/check-i18n-consistency.mjs'
      - '.github/workflows/check-internationalization.yml'
  push:
    branches:
      - main
    paths:
      - 'en/**'
      - 'index.html'
      - 'cerchi/guide/**'
      - 'cerchi/index.html'
      - 'cerchi/triadi/index.html'
      - 'temi/index.html'
      - 'en.html'
      - 'metodo-ai.html'
      - 'strumenti.html'
      - 'assets/script.js'
      - 'assets/style.css'
      - 'assets/international-atlas.*'
      - 'assets/international-pasolini.css'
      - 'assets/international-plato.css'
      - 'tools/international_revision.py'
      - 'tools/validate-cerchi-guide.py'
      - 'tools/check-international-guide.py'
      - 'tools/check-international-atlas.mjs'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'llms.txt'
      - 'archivio.html'
      - 'tools/check-i18n-consistency.mjs'
      - '.github/workflows/check-internationalization.yml'

permissions:
  contents: read

jobs:
  internationalization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bilingual architecture and complete English corpus
        run: node tools/check-i18n-consistency.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify shared International behaviour
        run: |
          node --check assets/international-atlas.js
          node tools/check-international-atlas.mjs
      - name: Verify pinned Plato EN revision and regression mutations
        run: |
          git fetch --no-tags origin f36e2f29a7ea9ec6e691244c851ad3b877ed236a
          python3 tools/international_revision.py --base c3c6936268a02b3b43474cb4aba7bfb42890530e --self-test
          git show f36e2f29a7ea9ec6e691244c851ad3b877ed236a:PLATO_EN_GUIDE_01_CANDIDATE_v2.md > "$RUNNER_TEMP/plato-v2.md"
          python3 tools/validate-cerchi-guide.py en/cerchi/guides/plato-ideas-truth-power/index.html --cover assets/img/cerchi/cerchi-platone-idee-verita-potere-1600x900.jpg --source "$RUNNER_TEMP/plato-v2.md" --mode EN_REVISION --base c3c6936268a02b3b43474cb4aba7bfb42890530e
      - name: Preserve existing English guides during migration
        if: github.event_name == 'pull_request'
        env:
          ATLAS_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/check-international-guide.py --base "$ATLAS_BASE"
