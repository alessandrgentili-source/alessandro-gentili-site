name: Check internationalization

on:
  pull_request:
    paths:
      - 'en/**'
      - 'index.html'
      - 'cerchi/index.html'
      - 'cerchi/triadi/index.html'
      - 'temi/index.html'
      - 'cerchi/guide/alessandro-manzoni-lingua-storia-responsabilita/index.html'
      - 'cerchi/guide/carlo-collodi-formazione-prova-mondo/index.html'
      - 'cerchi/guide/pier-paolo-pasolini-mutazione-antropologica-omologazione/index.html'
      - 'cerchi/guide/platone-vita-opere-pensiero/index.html'
      - 'cerchi/guide/dante-vita-opere-commedia-esilio/index.html'
      - 'cerchi/guide/machiavelli-vita-opere-pensiero-politico/index.html'
      - 'cerchi/guide/marx-vita-opere-pensiero/index.html'
      - 'cerchi/guide/nietzsche-vita-opere-pensiero/index.html'
      - 'cerchi/guide/leopardi-desiderio-infinito-modernita/index.html'
      - 'cerchi/guide/seneca-dominio-tempo-morte/index.html'
      - 'cerchi/guide/aristotele-forma-fine-realta/index.html'
      - 'cerchi/guide/weber-razionalizzazione-potere-disincanto/index.html'
      - 'cerchi/guide/freud-inconscio-desiderio-civilta/index.html'
      - 'cerchi/guide/gramsci-egemonia-cultura-senso-comune/index.html'
      - 'cerchi/guide/hobbes-paura-sovranita-ordine-politico/index.html'
      - 'cerchi/guide/averroe-ragione-interpretazione-legge/index.html'
      - 'cerchi/guide/simmel-denaro-metropoli-individualita/index.html'
      - 'cerchi/guide/adam-smith-scambio-simpatia-ricchezza/index.html'
      - 'en.html'
      - 'metodo-ai.html'
      - 'strumenti.html'
      - 'assets/script.js'
      - 'assets/style.css'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'llms.txt'
      - 'tools/check-i18n-consistency.mjs'
      - '.github/workflows/check-internationalization.yml'
  push:
    branches:
      - main
    paths:
      - 'en/**'
      - 'index.html'
      - 'cerchi/index.html'
      - 'cerchi/triadi/index.html'
      - 'temi/index.html'
      - 'cerchi/guide/alessandro-manzoni-lingua-storia-responsabilita/index.html'
      - 'cerchi/guide/carlo-collodi-formazione-prova-mondo/index.html'
      - 'cerchi/guide/pier-paolo-pasolini-mutazione-antropologica-omologazione/index.html'
      - 'cerchi/guide/platone-vita-opere-pensiero/index.html'
      - 'cerchi/guide/dante-vita-opere-commedia-esilio/index.html'
      - 'cerchi/guide/machiavelli-vita-opere-pensiero-politico/index.html'
      - 'cerchi/guide/marx-vita-opere-pensiero/index.html'
      - 'cerchi/guide/nietzsche-vita-opere-pensiero/index.html'
      - 'cerchi/guide/leopardi-desiderio-infinito-modernita/index.html'
      - 'cerchi/guide/seneca-dominio-tempo-morte/index.html'
      - 'cerchi/guide/aristotele-forma-fine-realta/index.html'
      - 'cerchi/guide/weber-razionalizzazione-potere-disincanto/index.html'
      - 'cerchi/guide/freud-inconscio-desiderio-civilta/index.html'
      - 'cerchi/guide/gramsci-egemonia-cultura-senso-comune/index.html'
      - 'cerchi/guide/hobbes-paura-sovranita-ordine-politico/index.html'
      - 'cerchi/guide/averroe-ragione-interpretazione-legge/index.html'
      - 'cerchi/guide/simmel-denaro-metropoli-individualita/index.html'
      - 'cerchi/guide/adam-smith-scambio-simpatia-ricchezza/index.html'
      - 'en.html'
      - 'metodo-ai.html'
      - 'strumenti.html'
      - 'assets/script.js'
      - 'assets/style.css'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'llms.txt'
      - 'tools/check-i18n-consistency.mjs'
      - '.github/workflows/check-internationalization.yml'

permissions:
  contents: read

jobs:
  internationalization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bilingual architecture and English rollout
        run: node tools/check-i18n-consistency.mjs
