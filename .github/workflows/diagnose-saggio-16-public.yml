name: Diagnose Saggio 16 public delivery

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose-public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR source
        uses: actions/checkout@v4

      - name: Probe public HTTP and compare deployed binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics/http
          urls=(
            "https://alessandro-gentili.it/"
            "https://alessandro-gentili.it/saggi.html"
            "https://alessandro-gentili.it/saggi/saggio-16-la-pace-senza-forma.html"
            "https://alessandro-gentili.it/assets/img/saggi/site/saggio-16-la-pace-senza-forma-960x540.webp?v=20260804"
            "https://alessandro-gentili.it/assets/img/saggi/site/saggio-16-la-pace-senza-forma_site_960x540.webp?v=20260804"
          )
          n=0
          for url in "${urls[@]}"; do
            n=$((n+1))
            echo "=== $url ===" | tee -a diagnostics/http/report.txt
            curl -sS -L --fail-with-body \
              -H 'Cache-Control: no-cache' \
              -D "diagnostics/http/headers-$n.txt" \
              -o "diagnostics/http/body-$n.bin" \
              -w 'final_url=%{url_effective}\nstatus=%{http_code}\ncontent_type=%{content_type}\nsize_download=%{size_download}\nredirects=%{num_redirects}\n' \
              "$url" | tee -a diagnostics/http/report.txt
            grep -iE '^(cache-control|age|etag|last-modified|content-length|content-type|location|server|x-cache|via):' "diagnostics/http/headers-$n.txt" | tee -a diagnostics/http/report.txt || true
            file "diagnostics/http/body-$n.bin" | tee -a diagnostics/http/report.txt
            sha256sum "diagnostics/http/body-$n.bin" | tee -a diagnostics/http/report.txt
          done

          cp diagnostics/http/body-4.bin diagnostics/http/public-versioned.webp
          cp diagnostics/http/body-5.bin diagnostics/http/public-canonical.webp
          cp assets/img/saggi/site/saggio-16-la-pace-senza-forma-960x540.webp diagnostics/http/repo-versioned.webp
          cp assets/img/saggi/site/saggio-16-la-pace-senza-forma_site_960x540.webp diagnostics/http/repo-canonical.webp

          echo '=== Repository vs deployed files ===' | tee -a diagnostics/http/report.txt
          wc -c diagnostics/http/*.webp | tee -a diagnostics/http/report.txt
          sha256sum diagnostics/http/*.webp | tee -a diagnostics/http/report.txt
          if cmp -s diagnostics/http/public-versioned.webp diagnostics/http/repo-versioned.webp; then
            echo 'public_versioned_matches_repo=true' | tee -a diagnostics/http/report.txt
          else
            echo 'public_versioned_matches_repo=false' | tee -a diagnostics/http/report.txt
          fi
          if cmp -s diagnostics/http/public-canonical.webp diagnostics/http/repo-canonical.webp; then
            echo 'public_canonical_matches_repo=true' | tee -a diagnostics/http/report.txt
          else
            echo 'public_canonical_matches_repo=false' | tee -a diagnostics/http/report.txt
          fi

          python3 -m pip install --quiet pillow
          python3 - <<'PY' | tee -a diagnostics/http/report.txt
          from pathlib import Path
          from PIL import Image, ImageStat, ImageChops, ImageDraw
          import hashlib

          files = [
              'public-versioned.webp', 'public-canonical.webp',
              'repo-versioned.webp', 'repo-canonical.webp'
          ]
          images = {}
          for name in files:
              p = Path('diagnostics/http') / name
              data = p.read_bytes()
              im = Image.open(p).convert('RGB')
              images[name] = im
              stat = ImageStat.Stat(im)
              print(f'{name}: bytes={len(data)} sha256={hashlib.sha256(data).hexdigest()} size={im.size} mean={[round(v,2) for v in stat.mean]} extrema={stat.extrema}')

          public = images['public-versioned.webp']
          repo = images['repo-versioned.webp']
          diff = ImageChops.difference(public, repo)
          print(f'public_repo_bbox={diff.getbbox()} public_repo_rms={[round(v,2) for v in ImageStat.Stat(diff).rms]}')

          canvas = Image.new('RGB', (1920, 620), 'white')
          canvas.paste(public, (0, 0))
          canvas.paste(repo, (960, 0))
          draw = ImageDraw.Draw(canvas)
          draw.text((20, 565), 'PUBLIC DEPLOYED', fill='black')
          draw.text((980, 565), 'REPOSITORY MAIN/PR', fill='black')
          canvas.save('diagnostics/http/public-vs-repository.png')

          for i in (1, 2, 3):
              text = Path(f'diagnostics/http/body-{i}.bin').read_text('utf-8', errors='replace')
              print(f'page_{i}_has_saggio16={"saggio-16-la-pace-senza-forma" in text}')
              print(f'page_{i}_has_versioned_asset={"saggio-16-la-pace-senza-forma-960x540.webp" in text}')
              print(f'page_{i}_has_canonical_asset={"saggio-16-la-pace-senza-forma_site_960x540.webp" in text}')
          PY

      - name: Install browser probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics/browser
          npm --prefix diagnostics/browser init -y >/dev/null
          npm --prefix diagnostics/browser install playwright@1.54.2 >/dev/null
          npx --prefix diagnostics/browser playwright install --with-deps chromium >/dev/null

      - name: Verify rendered DOM desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          cat > diagnostics/browser/probe.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';

          const targets = [
            ['home', 'https://alessandro-gentili.it/'],
            ['saggi', 'https://alessandro-gentili.it/saggi.html'],
            ['essay', 'https://alessandro-gentili.it/saggi/saggio-16-la-pace-senza-forma.html'],
          ];
          const viewports = [
            ['desktop', { width: 1440, height: 1000 }],
            ['mobile', { width: 390, height: 844 }],
          ];
          const browser = await chromium.launch({ headless: true });
          const report = [];
          let failed = false;
          for (const [mode, viewport] of viewports) {
            for (const [name, url] of targets) {
              const context = await browser.newContext({ viewport });
              const page = await context.newPage();
              const errors = [];
              page.on('console', msg => { if (msg.type() === 'error') errors.push(`console: ${msg.text()}`); });
              page.on('pageerror', err => errors.push(`pageerror: ${err.message}`));
              page.on('requestfailed', req => errors.push(`requestfailed: ${req.url()} :: ${req.failure()?.errorText}`));
              const response = await page.goto(`${url}${url.includes('?') ? '&' : '?'}probe=20260804b`, { waitUntil: 'networkidle', timeout: 60000 });
              const locator = page.locator('img[src*="saggio-16-la-pace-senza-forma"]');
              const count = await locator.count();
              for (let i = 0; i < count; i += 1) {
                await locator.nth(i).scrollIntoViewIfNeeded();
              }
              if (count > 0) {
                await page.waitForFunction(() => [...document.images].filter(img => img.src.includes('saggio-16-la-pace-senza-forma')).every(img => img.complete && img.naturalWidth > 0), null, { timeout: 15000 });
              }
              const images = await page.evaluate(() => [...document.images]
                .filter(img => img.src.includes('saggio-16-la-pace-senza-forma'))
                .map(img => {
                  const css = getComputedStyle(img);
                  const r = img.getBoundingClientRect();
                  return {
                    src: img.src,
                    currentSrc: img.currentSrc,
                    complete: img.complete,
                    naturalWidth: img.naturalWidth,
                    naturalHeight: img.naturalHeight,
                    display: css.display,
                    visibility: css.visibility,
                    opacity: css.opacity,
                    width: r.width,
                    height: r.height,
                  };
                }));
              await page.screenshot({ path: `diagnostics/browser/${mode}-${name}.png`, fullPage: true });
              const ok = response?.status() === 200 && images.length > 0 && images.every(img => img.complete && img.naturalWidth === 960 && img.naturalHeight === 540 && img.display !== 'none' && img.visibility !== 'hidden' && Number(img.opacity) > 0 && img.width > 0 && img.height > 0) && errors.length === 0;
              if (!ok) failed = true;
              report.push({ mode, name, url, documentStatus: response?.status(), images, errors, ok });
              await context.close();
            }
          }
          await browser.close();
          await fs.writeFile('diagnostics/browser/report.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          if (failed) process.exitCode = 1;
          JS
          node diagnostics/browser/probe.mjs

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saggio-16-public-diagnostics
          path: diagnostics/
          retention-days: 7
