name: Fix Saggio 16 cover cache bust

on:
  push:
    branches:
      - fix/saggio-16-cover-cache-bust
    paths:
      - .staging/saggio16-cover/READY

permissions:
  contents: write

jobs:
  fix-cover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/saggio-16-cover-cache-bust
          fetch-depth: 0

      - name: Replace cover references and validate asset
        shell: bash
        run: |
          set -euo pipefail
          old='saggio-16-la-pace-senza-forma_site_960x540.webp'
          new='saggio-16-la-pace-senza-forma-960x540.webp'
          asset="assets/img/saggi/site/$new"

          test -f "$asset"

          python - <<'PY'
          from pathlib import Path

          old = 'saggio-16-la-pace-senza-forma_site_960x540.webp'
          new = 'saggio-16-la-pace-senza-forma-960x540.webp'
          targets = [
              Path('index.html'),
              Path('saggi.html'),
              Path('assets/script.js'),
              Path('saggi/saggio-16-la-pace-senza-forma.html'),
              Path('tools/check-saggio-16-publication.mjs'),
          ]
          changed = []
          for path in targets:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              if old in text:
                  path.write_text(text.replace(old, new), encoding='utf-8')
                  changed.append(str(path))
          if not changed:
              raise SystemExit('No Saggio 16 cover references were updated')
          print('Updated:', ', '.join(changed))

          data = Path('assets/img/saggi/site/' + new).read_bytes()
          if data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit('Replacement asset is not a valid RIFF/WEBP file')
          PY

          grep -q "$new" index.html
          grep -q "$new" saggi.html
          grep -q "$new" saggi/saggio-16-la-pace-senza-forma.html
          ! grep -R --line-number --fixed-strings "$old" index.html saggi.html assets/script.js saggi/saggio-16-la-pace-senza-forma.html tools/check-saggio-16-publication.mjs

          rm -rf .staging/saggio16-cover
          rm -f .github/workflows/fix-saggio-16-cover-cache-bust.yml

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Use cache-busted Saggio 16 cover asset"
          git push origin HEAD:fix/saggio-16-cover-cache-bust
