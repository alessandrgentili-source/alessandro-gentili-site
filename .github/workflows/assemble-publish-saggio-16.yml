name: Assemble Saggio 16 publication

on:
  push:
    branches:
      - publish-saggio-16-la-pace-senza-forma
    paths:
      - .staging/saggio16/READY

permissions:
  contents: write

jobs:
  assemble-publication:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Assemble page and update publication surfaces
        shell: bash
        run: |
          set -euo pipefail
          stage_dir=".staging/saggio16"
          test -f "$stage_dir/page.html.gz.b64"
          test -f "$stage_dir/page.sha256"
          test -f "$stage_dir/saggio16.js.txt"
          test -f "assets/img/saggi/site/saggio-16-la-pace-senza-forma_site_960x540.webp"

          base64 --decode "$stage_dir/page.html.gz.b64" | gzip --decompress > /tmp/saggio16.html
          expected_sha="$(tr -d '[:space:]' < "$stage_dir/page.sha256")"
          echo "$expected_sha  /tmp/saggio16.html" | sha256sum --check

          mkdir -p saggi
          cp /tmp/saggio16.html saggi/saggio-16-la-pace-senza-forma.html

          python - <<'PY'
          from pathlib import Path

          stage = Path('.staging/saggio16')
          page = Path('saggi/saggio-16-la-pace-senza-forma.html')
          script = Path('assets/script.js')
          sitemap = Path('sitemap.xml')

          page_text = page.read_text(encoding='utf-8')
          required_page_markers = [
              '<title>La pace senza forma | Alessandro Gentili</title>',
              'Saggio 16',
              '<h2>Studi</h2>',
              '<h2>Riferimenti</h2>',
              '<h2>English note</h2>',
              'saggio-16-la-pace-senza-forma_site_960x540.webp',
              'https://alessandro-gentili.it/saggi/saggio-16-la-pace-senza-forma.html',
          ]
          missing = [marker for marker in required_page_markers if marker not in page_text]
          if missing:
              raise SystemExit(f'Missing page markers: {missing}')

          script_text = script.read_text(encoding='utf-8')
          addon = (stage / 'saggio16.js.txt').read_text(encoding='utf-8').strip()
          marker = '// Keep Saggio 16 visible across the homepage, essays index and general archive.'
          if marker not in script_text:
              script.write_text(script_text.rstrip() + '\n\n' + addon + '\n', encoding='utf-8')

          sitemap_text = sitemap.read_text(encoding='utf-8')
          url = 'https://alessandro-gentili.it/saggi/saggio-16-la-pace-senza-forma.html'
          if url not in sitemap_text:
              entry = (
                  '  <url>\n'
                  f'    <loc>{url}</loc>\n'
                  '    <lastmod>2026-08-04</lastmod>\n'
                  '  </url>\n'
              )
              if '</urlset>' not in sitemap_text:
                  raise SystemExit('sitemap.xml has no closing urlset tag')
              sitemap.write_text(sitemap_text.replace('</urlset>', entry + '</urlset>'), encoding='utf-8')
          PY

          node --check assets/script.js
          grep -q "data-saggio-16" assets/script.js
          grep -q "saggio-16-la-pace-senza-forma.html" sitemap.xml
          grep -q "Defence Readiness Roadmap 2030 propone quattro iniziative faro" saggi/saggio-16-la-pace-senza-forma.html
          grep -q "interpretazione rivendicata e contestata" saggi/saggio-16-la-pace-senza-forma.html
          grep -q "gli alleati NATO si sono impegnati a investire entro il 2035 il 5%" saggi/saggio-16-la-pace-senza-forma.html

          rm -rf "$stage_dir"
          rm -f .github/workflows/assemble-publish-saggio-16.yml

      - name: Commit publication files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Publish Saggio 16 La pace senza forma"
          git push origin HEAD:${{ github.ref_name }}
