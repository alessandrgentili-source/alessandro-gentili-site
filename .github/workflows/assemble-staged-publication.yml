name: Assemble staged static publication

on:
  push:
    branches:
      - 'publish/**'
    paths:
      - '.staging/**'

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Validate and extract publication bundle
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t manifests < <(find .staging -type f -name SHA256 -print | sort)
          if [ "${#manifests[@]}" -ne 1 ]; then
            echo "Expected exactly one SHA256 manifest, found ${#manifests[@]}" >&2
            exit 1
          fi

          bundle_dir="$(dirname "${manifests[0]}")"
          cat "$bundle_dir"/part-*.txt > /tmp/static-publication.b64
          base64 --decode /tmp/static-publication.b64 > /tmp/static-publication.tar.gz

          expected_sha="$(tr -d '[:space:]' < "${manifests[0]}")"
          echo "$expected_sha  /tmp/static-publication.tar.gz" | sha256sum --check

          python - <<'PY'
          import pathlib
          import re
          import tarfile

          archive = pathlib.Path('/tmp/static-publication.tar.gz')
          allowed_directories = {
              'cerchi',
              'cerchi/guide',
              'cerchi/triadi',
              'assets',
              'assets/img',
              'assets/img/cerchi',
          }
          guide_directory = re.compile(r'cerchi/guide/[a-z0-9-]+')
          guide_page = re.compile(r'cerchi/guide/[a-z0-9-]+/index\.html')
          cerchi_asset = re.compile(
              r'assets/img/cerchi/[A-Za-z0-9._-]+\.(?:webp|jpg|jpeg|png)'
          )

          with tarfile.open(archive, 'r:gz') as tar:
              members = tar.getmembers()
              if not members or len(members) > 20:
                  raise SystemExit(f'Unexpected archive member count: {len(members)}')

              seen = set()
              for member in members:
                  raw_name = member.name
                  raw_path = pathlib.PurePosixPath(raw_name)
                  if not raw_name or raw_path.is_absolute() or '..' in raw_path.parts:
                      raise SystemExit(f'Unsafe archive member: {raw_name}')

                  name = raw_name[2:] if raw_name.startswith('./') else raw_name
                  name = name.rstrip('/')
                  if not name or name in seen:
                      raise SystemExit(f'Empty or duplicate archive member: {raw_name}')
                  seen.add(name)

                  if member.isdir():
                      if name not in allowed_directories and not guide_directory.fullmatch(name):
                          raise SystemExit(f'Directory outside publication scope: {raw_name}')
                      continue

                  if not member.isfile():
                      raise SystemExit(f'Special files and links are not allowed: {raw_name}')
                  if member.size > 10 * 1024 * 1024:
                      raise SystemExit(f'Publication file is unexpectedly large: {raw_name}')

                  allowed_file = (
                      name in {
                          'cerchi/index.html',
                          'cerchi/triadi/index.html',
                          'sitemap.xml',
                      }
                      or guide_page.fullmatch(name)
                      or cerchi_asset.fullmatch(name)
                  )
                  if not allowed_file:
                      raise SystemExit(f'File outside publication scope: {raw_name}')
          PY

          tar -xzf /tmp/static-publication.tar.gz -C .
          rm -rf .staging
          rm -f .github/workflows/publish-*.yml

      - name: Commit assembled publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Assemble staged static publication"
          git push origin HEAD:${{ github.ref_name }}
