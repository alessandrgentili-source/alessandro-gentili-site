name: Check archive consistency

on:
  pull_request:
    paths:
      - 'archivio.html'
      - 'saggi/**'
      - 'portfolio/**'
      - 'sitemap.xml'
      - 'assets/script.js'
      - 'tools/check-archive-consistency.mjs'
      - '.github/workflows/check-archive-consistency.yml'
  push:
    branches:
      - main
    paths:
      - 'archivio.html'
      - 'saggi/**'
      - 'portfolio/**'
      - 'sitemap.xml'
      - 'assets/script.js'
      - 'tools/check-archive-consistency.mjs'
      - '.github/workflows/check-archive-consistency.yml'

permissions:
  contents: read

jobs:
  archive-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify static archive coverage
        run: node tools/check-archive-consistency.mjs
