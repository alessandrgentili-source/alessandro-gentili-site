    <path class="line" d="M14 701 C62 515 203 384 411 365 C505 356 588 374 674 419" />
    <path class="line-soft" d="M86 789 C119 579 241 431 439 376 C522 353 590 354 654 380" />
    <path class="line-soft" d="M-26 617 C84 533 188 499 300 510 C409 521 494 578 562 679" />
