    <circle class="node-soft" cx="477" cy="719" r="4.2" />
    <circle class="node" cx="1280" cy="104" r="3.8" />
    <circle class="node" cx="1344" cy="850" r="4.2" />
    <circle class="node-soft" cx="1246" cy="711" r="2.6" />
