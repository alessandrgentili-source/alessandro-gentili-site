<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc">
  <title id="title">Visual astratto del Saggio 0</title>
  <desc id="desc">Composizione astratta su carta chiara con archi, linee sottili, nodi e segni geometrici, senza testo.</desc>
  <defs>
    <filter id="paperNoise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="4" seed="17" result="noise" />
      <feColorMatrix in="noise" type="matrix" values="0.45 0 0 0 0.72  0 0.38 0 0 0.62  0 0 0.25 0 0.42  0 0 0 .18 0" />
    </filter>
    <filter id="fineGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="29" result="grain" />
      <feColorMatrix in="grain" type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.045" />
      </feComponentTransfer>
    </filter>
    <radialGradient id="warmField" cx="28%" cy="45%" r="82%">
      <stop offset="0" stop-color="#f8f0df" />
      <stop offset="0.52" stop-color="#f2e6cf" />
      <stop offset="1" stop-color="#ead7b9" />
    </radialGradient>
    <linearGradient id="edgeShade" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#a7813f" stop-opacity="0.08" />
      <stop offset="0.38" stop-color="#fff8ec" stop-opacity="0" />
      <stop offset="1" stop-color="#8d6d37" stop-opacity="0.09" />
    </linearGradient>
    <style>
      .line{fill:none;stroke:#8d6d37;stroke-width:1.05;stroke-linecap:round;stroke-opacity:.24;vector-effect:non-scaling-stroke}
      .line-soft{fill:none;stroke:#8d6d37;stroke-width:.8;stroke-linecap:round;stroke-opacity:.13;vector-effect:non-scaling-stroke}
      .dash{stroke-dasharray:4 9}
      .node{fill:#b99245;fill-opacity:.58}
      .node-soft{fill:#8d6d37;fill-opacity:.28}
      .mark{stroke:#8d6d37;stroke-width:.9;stroke-opacity:.2;vector-effect:non-scaling-stroke}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#warmField)" />
  <rect width="1600" height="900" filter="url(#paperNoise)" opacity=".56" />
  <rect width="1600" height="900" fill="url(#edgeShade)" />
  <rect width="1600" height="900" filter="url(#fineGrain)" opacity=".62" />

  <g opacity=".72">
